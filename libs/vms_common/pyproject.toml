[project]
name = "vms-common"
version = "0.1.0"
description = "Shared runtime library: contracts, Kafka, storage, LLM gateway, config, logging, ids, metrics"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "aiokafka>=0.11",
    "boto3>=1.35",
    "prometheus-client>=0.21",
    "redis>=5.0",
    "numpy>=1.26",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    # Pinned close to deploy/compose/docker-compose.yml's qdrant/qdrant:v1.11.5
    # server — qdrant-client warns above a 1-minor gap from the server it
    # talks to (verified: 1.19 against a v1.16 test container warns, though
    # doesn't fail; the real gap against the pinned v1.11.5 server would be
    # larger and untested).
    "qdrant-client>=1.11,<1.12",
]

[project.optional-dependencies]
llm = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "litellm>=1.103,<1.104",
    "pillow>=10.4",
    "pyyaml>=6.0",
]

# hf_local (P5-D5): fine-tuned LoRA adapters served in-process on the GPU. torch and transformers
# are not listed: the GPU services pin them (torch 2.6.0 from the cu124 index), and a second pin here
# would fight theirs. `uv sync --all-packages --extra hf` adds these three to that environment.
hf = [
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "accelerate>=1.0",
]

# Text embeddings for the `knowledge` collection (bge-small dense + BM25 sparse), CPU/ONNX.
knowledge = [
    "fastembed>=0.3,<0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vms_common"]
