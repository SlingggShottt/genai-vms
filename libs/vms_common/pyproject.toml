[project]
name = "vms-common"
version = "0.1.0"
description = "Shared runtime library: contracts, Kafka, storage, LLM gateway, config, logging, ids, metrics"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "aiokafka>=0.11",
    "boto3>=1.35",
    "prometheus-client>=0.21",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vms_common"]
