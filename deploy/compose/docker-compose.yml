# GenAI-VMS — Docker Compose, profile "infra".
#
# Kafka (KRaft, single broker), kafka-ui, Postgres, Qdrant, Redis, MinIO
# (S3-compatible, buckets auto-created), MediaMTX. Started with:
#   make up PROFILE=infra
#
# `genai`, `obs`, `lite` profiles (design_architecture.md §12.1) are added
# by the stories that build those services (P1-J1 api, ...) — this file
# only carries `infra`, `tools` (camera_sim), `core` (ingestion, indexer)
# and `perception` so far.
#
# Image tags are pinned per docs/techstack.md's "verify" column; re-check
# them at setup time (registries and default branches change).

name: genai-vms

networks:
  vms-net:
    name: vms-net

volumes:
  prometheus_data:
  grafana_data:
  hf_cache:   # Hugging Face model cache for retrieval (SigLIP 2): downloaded once
  kafka_data:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
  mediamtx_recordings:

services:
  kafka:
    image: apache/kafka:3.8.0
    profiles: [infra]
    container_name: vms-kafka
    networks: [vms-net]
    restart: unless-stopped
    ports:
      - "9092:29092" # host clients -> localhost:9092; in-network clients -> kafka:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Fixed dev cluster id (any 22-char base64 string is valid for KRaft;
      # this one is arbitrary and only needs to stay stable across restarts
      # of the same kafka_data volume).
      CLUSTER_ID: "gvms-dev-kraft-cluster-01"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: kafbat/kafka-ui:latest
    profiles: [infra]
    container_name: vms-kafka-ui
    networks: [vms-net]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: genai-vms
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16
    profiles: [infra]
    container_name: vms-postgres
    networks: [vms-net]
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vms} -d ${POSTGRES_DB:-vms}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.11.5
    profiles: [infra]
    container_name: vms-qdrant
    networks: [vms-net]
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    # Docker 29 / containerd 2.x start containers with a 1024 soft nofile limit;
    # Qdrant exhausts it after a few dozen segments ("Too many open files",
    # HTTP stops accepting, upserts time out). Qdrant's docs recommend 65535.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    profiles: [infra]
    container_name: vms-redis
    networks: [vms-net]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # `quay.io/minio/minio` and `quay.io/minio/mc` (the two images this block
  # and `minio-init` used) both now 401/repository-not-found on every tag —
  # MinIO gated anonymous pulls on quay.io and removed docker.io/minio/minio
  # entirely, some time after this pin was written (docs/techstack.md's own
  # "verify MinIO community image distribution... before pinning" note).
  # `bitnamilegacy/minio` is Bitnami's frozen (no longer updated, but still
  # pullable) MinIO packaging — verified for real: `MINIO_ROOT_USER`/
  # `MINIO_ROOT_PASSWORD` match upstream exactly, `mc ready local` still
  # works (mc ships in the same image), and a real boto3 `S3Client`
  # put/get/presigned-GET round-trip against it succeeds. Its data dir is
  # `/bitnami/minio/data`, not `/data` (volume path updated to match), and
  # `MINIO_DEFAULT_BUCKETS` auto-creates buckets on startup, removing the
  # need for a separate `minio-init` + `mc` image entirely.
  minio:
    image: bitnamilegacy/minio:latest
    profiles: [infra]
    container_name: vms-minio
    networks: [vms-net]
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vms-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # Buckets from design_architecture.md §6.3.
      MINIO_DEFAULT_BUCKETS: vms-segments,vms-keyframes,vms-twins,vms-crops,vms-masks,vms-evidence,vms-reports,vms-models
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mediamtx:
    # `-ffmpeg` is the Alpine-based variant (same MediaMTX version as `latest`)
    # and ships /bin/sh + wget. Plain `latest` is a scratch image with neither,
    # so the exec healthcheck below could never pass: the container sat
    # "unhealthy" forever and everything gating on `service_healthy`
    # (ingestion, camera-sim) refused to start.
    image: bluenviron/mediamtx:latest-ffmpeg
    profiles: [infra]
    container_name: vms-mediamtx
    networks: [vms-net]
    restart: unless-stopped
    ports:
      - "8554:8554" # RTSP
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC (WHEP/WHIP)
      - "9997:9997" # HTTP control API (health check only; not exposed publicly in prod)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - mediamtx_recordings:/recordings
    healthcheck:
      # Compose healthchecks always exec *inside* the container, so the image
      # needs wget (see the image comment above). Localhost callers may use
      # MediaMTX's control API without credentials; the published :9997 from
      # the host does require them.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9997/v3/config/global/get"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  camera-sim:
    profiles: [tools]
    container_name: vms-camera-sim
    build:
      context: ../.. # repo root — see tools/camera_sim/Dockerfile
      dockerfile: tools/camera_sim/Dockerfile
    networks: [vms-net]
    depends_on:
      mediamtx:
        condition: service_healthy
    # Datasets (P1-D6) and the manifest live on the host, not in the image,
    # so `docker compose build` doesn't need to re-run every time a dataset
    # changes.
    volumes:
      - ../../config:/app/config:ro
      - ../../ml/datasets:/app/ml/datasets:ro
    command: ["--manifest", "/app/config/camera_sim.yaml"]
    restart: unless-stopped

  ingestion:
    profiles: [core]
    container_name: vms-ingestion
    build:
      context: ../.. # repo root — see services/ingestion/Dockerfile
      dockerfile: services/ingestion/Dockerfile
    networks: [vms-net]
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    environment:
      VMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VMS_STORAGE_ENDPOINT_URL: http://minio:9000
      VMS_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-vms-admin}
      VMS_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      VMS_REDIS_URL: redis://redis:6379/0
      # No VMS_INGESTION_API_BASE_URL yet — api (P1-J1/P1-J3) doesn't exist;
      # falls back to config/cameras.yaml until then (see settings.py).
      VMS_INGESTION_CAMERAS_YAML_FALLBACK: /app/config/cameras.yaml
    volumes:
      - ../../config:/app/config:ro
    restart: unless-stopped

  perception:
    profiles: [perception]
    container_name: vms-perception
    build:
      context: ../.. # repo root — see services/perception/Dockerfile
      dockerfile: services/perception/Dockerfile
    networks: [vms-net]
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      VMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VMS_STORAGE_ENDPOINT_URL: http://minio:9000
      VMS_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-vms-admin}
      VMS_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      VMS_REDIS_URL: redis://redis:6379/0
      # No VMS_PERCEPTION_API_BASE_URL yet — api (P2-J4) doesn't exist;
      # falls back to config/zones.yaml until then (see settings.py).
      VMS_PERCEPTION_ZONES_YAML_FALLBACK: /app/config/zones.yaml
    volumes:
      - ../../config:/app/config:ro
    # GPU required — one CUDA context for YOLO11 + SigLIP2 (design_architecture.md §11.3).
    # Untested against a real Docker daemon in this environment; verify
    # `docker run --gpus all ... nvidia-smi` works before relying on this block.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  indexer:
    profiles: [core]
    container_name: vms-indexer
    build:
      context: ../.. # repo root — see services/indexer/Dockerfile
      dockerfile: services/indexer/Dockerfile
    networks: [vms-net]
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      VMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VMS_STORAGE_ENDPOINT_URL: http://minio:9000
      VMS_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-vms-admin}
      VMS_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      VMS_DB_DSN: postgresql+asyncpg://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vms}
      VMS_QDRANT_URL: http://qdrant:6333
      # Text knowledge (event captions, incident reports): the ONNX models are cached in a volume.
      VMS_KNOWLEDGE_CACHE_DIR: /hf/fastembed
    volumes:
      - hf_cache:/hf
    restart: unless-stopped

  # Rule engine over twinready.v1 -> events.candidates (P3-D1). Needs migration
  # 0004 (`make migrate`). Zone names arrive in the twin from perception; this
  # service looks the zones up again (type, schedule) from the same source —
  # there is no api service in Compose yet, so the YAML fallback is used. Also runs the VLM
  # verification gate (P3-D4): needs migration 0008 and the LLM gateway (see the env below).
  events:
    profiles: [core]
    container_name: vms-events
    build:
      context: ../.. # repo root — see services/events/Dockerfile
      dockerfile: services/events/Dockerfile
    networks: [vms-net]
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      VMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VMS_STORAGE_ENDPOINT_URL: http://minio:9000
      VMS_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-vms-admin}
      VMS_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      VMS_DB_DSN: postgresql+asyncpg://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vms}
      VMS_REDIS_URL: redis://redis:6379/0
      # EVENTS_RULES_FILE (in .env) picks another file in config/, e.g. a gitignored rules.local.yaml.
      VMS_EVENTS_RULES_PATH: /app/config/${EVENTS_RULES_FILE:-rules.yaml}
      VMS_EVENTS_ZONES_YAML_FALLBACK: /app/config/zones.yaml
      # The VLM gate (P3-D4) calls the LLM gateway. Ollama runs on the host (or laptop B: set
      # VMS_LLM_OLLAMA_URL in .env), and must listen on more than loopback to be reachable from here
      # (OLLAMA_HOST=0.0.0.0).
      VMS_LLM_PROFILE: ${VMS_LLM_PROFILE:-local}
      VMS_LLM_MODELS_PATH: /app/config/models.yaml
      VMS_LLM_OLLAMA_URL: ${VMS_LLM_OLLAMA_URL:-http://host.docker.internal:11434}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../config:/app/config:ro
    restart: unless-stopped

  # Links verified events across cameras (event.v1 -> events.correlation_groups ->
  # correlation.v1, P3-J2). Needs migration 0006 (`make migrate`). The camera graph comes
  # from config/topology.yaml (copy topology.example.yaml) until the api is a Compose
  # service; with no file every event is its own group.
  correlation:
    profiles: [core]
    container_name: vms-correlation
    build:
      context: ../.. # repo root — see services/correlation/Dockerfile
      dockerfile: services/correlation/Dockerfile
    networks: [vms-net]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      VMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VMS_DB_DSN: postgresql+asyncpg://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vms}
      VMS_CORRELATION_CONFIG_PATH: /app/config/correlation.yaml
      VMS_CORRELATION_TOPOLOGY_YAML_FALLBACK: /app/config/topology.yaml
    volumes:
      - ../../config:/app/config:ro
    restart: unless-stopped

  # --- application services ------------------------------------------------------------------
  # api + frontend (profile core), retrieval + reasoning (profile genai). Migrations are not run
  # by the containers: `make migrate` first. Language models run in Ollama on the host
  # (OLLAMA_HOST=0.0.0.0, see VMS_LLM_OLLAMA_URL); `deploy/demo/start.sh` starts the same
  # services on the host instead when a faster edit loop is wanted.

  api:
    profiles: [core]
    container_name: vms-api
    build:
      context: ../.. # repo root — see services/api/Dockerfile
      dockerfile: services/api/Dockerfile
    networks: [vms-net]
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      VMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VMS_STORAGE_ENDPOINT_URL: http://minio:9000
      # Presigned URLs are opened by the browser, which reaches MinIO on the published port.
      VMS_STORAGE_PUBLIC_ENDPOINT_URL: ${VMS_STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      VMS_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-vms-admin}
      VMS_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      VMS_DB_DSN: postgresql+asyncpg://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vms}
      VMS_REDIS_URL: redis://redis:6379/0
      VMS_JWT_SECRET: ${VMS_JWT_SECRET:?set VMS_JWT_SECRET in .env}
      VMS_ADMIN_EMAIL: ${VMS_ADMIN_EMAIL:-admin@genai-vms.dev}
      VMS_ADMIN_PASSWORD: ${VMS_ADMIN_PASSWORD:-}
      VMS_API_RETRIEVAL_URL: http://retrieval:8010
      VMS_API_SERVICE_TOKEN: ${VMS_API_SERVICE_TOKEN:-}
    restart: unless-stopped

  frontend:
    profiles: [core]
    container_name: vms-frontend
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    networks: [vms-net]
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  retrieval:
    profiles: [genai]
    container_name: vms-retrieval
    build:
      context: ../.. # repo root — see services/retrieval/Dockerfile
      dockerfile: services/retrieval/Dockerfile
    networks: [vms-net]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      VMS_STORAGE_ENDPOINT_URL: http://minio:9000
      VMS_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-vms-admin}
      VMS_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      VMS_DB_DSN: postgresql+asyncpg://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vms}
      VMS_REDIS_URL: redis://redis:6379/0
      VMS_QDRANT_URL: http://qdrant:6333
      VMS_LLM_PROFILE: ${VMS_LLM_PROFILE:-local}
      VMS_LLM_MODELS_PATH: /app/config/models.yaml
      VMS_LLM_OLLAMA_URL: ${VMS_LLM_OLLAMA_URL:-http://host.docker.internal:11434}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Footage older than this is not searched (recordings removed by retention). Empty = all.
      VMS_RETRIEVAL_ARCHIVE_SINCE: ${VMS_RETRIEVAL_ARCHIVE_SINCE:-}
      HF_HOME: /hf
      VMS_KNOWLEDGE_CACHE_DIR: /hf/fastembed
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../config:/app/config:ro
      - hf_cache:/hf
    restart: unless-stopped

  reasoning:
    profiles: [genai]
    container_name: vms-reasoning
    build:
      context: ../.. # repo root — see services/reasoning/Dockerfile
      dockerfile: services/reasoning/Dockerfile
    networks: [vms-net]
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      VMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      VMS_STORAGE_ENDPOINT_URL: http://minio:9000
      VMS_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-vms-admin}
      VMS_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      VMS_DB_DSN: postgresql+asyncpg://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vms}
      VMS_REDIS_URL: redis://redis:6379/0
      VMS_LLM_PROFILE: ${VMS_LLM_PROFILE:-local}
      VMS_LLM_MODELS_PATH: /app/config/models.yaml
      VMS_LLM_OLLAMA_URL: ${VMS_LLM_OLLAMA_URL:-http://host.docker.internal:11434}
      VMS_REASONING_VQA_BANK_PATH: /app/config/vqa_bank.yaml
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../config:/app/config:ro
    restart: unless-stopped

  # --- observability (profile obs): make up PROFILE=infra,core,genai,obs --------------------------
  prometheus:
    profiles: [obs]
    container_name: vms-prometheus
    image: prom/prometheus:v2.55.1
    networks: [vms-net]
    ports:
      - "9090:9090"
    volumes:
      - ./obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./obs/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    profiles: [obs]
    container_name: vms-grafana
    image: grafana/grafana:11.3.0
    networks: [vms-net]
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./obs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
