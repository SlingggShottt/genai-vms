apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vms

# Apply after the stack is installed (README.md, "Observability"):
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone deploy/k8s/obs | kubectl apply -f -
resources:
  - monitoring.yaml
  - prometheusrule.yaml

# The Grafana dashboard, picked up by the chart's dashboard sidecar (label grafana_dashboard=1).
configMapGenerator:
  - name: genai-vms-dashboard
    files:
      - overview.json=../../compose/obs/grafana/dashboards/overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
