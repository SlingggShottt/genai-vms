apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vms

resources:
  - ../../base

# Secrets come from a file that is never committed: copy secrets.env.example to secrets.env.
secretGenerator:
  - name: vms-secrets
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true

patches:
  # RTSP from outside the cluster (the camera simulator or a real camera pushes here).
  - target: { kind: Service, name: mediamtx }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30554
  # Images are built into minikube's Docker daemon (`eval $(minikube docker-env)`), never pulled.
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target: { kind: Job, name: migrate }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # Perception needs the NVIDIA device plugin and a labelled node; on a laptop without GPU
  # passthrough into minikube it runs on the host instead (see deploy/k8s/README.md).
  - target: { kind: Deployment, name: perception }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
