apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: genai-vms
    vms.io/tier: job
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: genai-vms
        vms.io/tier: job
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: genai-vms-api:latest
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "--package", "vms-db", "alembic", "-c", "libs/vms_db/alembic.ini", "upgrade", "head"]
          envFrom:
            - secretRef: { name: vms-secrets }
          workingDir: /app
