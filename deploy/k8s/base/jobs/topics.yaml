apiVersion: batch/v1
kind: Job
metadata:
  name: create-topics
  labels:
    app.kubernetes.io/name: create-topics
    app.kubernetes.io/part-of: genai-vms
    vms.io/tier: job
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: create-topics
        app.kubernetes.io/part-of: genai-vms
        vms.io/tier: job
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c", "set -e; B=kafka:9092; T=/opt/kafka/bin/kafka-topics.sh; until $T --bootstrap-server $B --list >/dev/null 2>&1; do sleep 3; done; for spec in vms.segments.v1:6:86400000 vms.twin.v1:6:259200000 vms.events.v1:6:604800000 vms.correlations.v1:3:604800000 vms.incidents.v1:3:604800000 vms.dlq.v1:1:1209600000; do IFS=: read n p r <<< \"$spec\"; $T --bootstrap-server $B --create --if-not-exists --topic $n --partitions $p --replication-factor 1 --config retention.ms=$r; done"]
