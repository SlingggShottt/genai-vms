apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: genai-vms
    vms.io/tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer
        app.kubernetes.io/part-of: genai-vms
        vms.io/tier: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9103"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: indexer
          image: genai-vms-indexer:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: vms-env }
            - secretRef: { name: vms-secrets }
          env:
            - { name: VMS_KNOWLEDGE_CACHE_DIR, value: "/hf/fastembed" }
          ports:
            - { name: metrics, containerPort: 9103 }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: hf, mountPath: /hf }
      volumes:
        - name: hf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: indexer
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: genai-vms
    vms.io/tier: app
spec:
  selector:
    app.kubernetes.io/name: indexer
  ports:
    - { name: metrics, port: 9103, targetPort: 9103 }
