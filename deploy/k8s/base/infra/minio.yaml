apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: genai-vms
    vms.io/tier: infra
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: genai-vms
        vms.io/tier: infra
    spec:
      containers:
        - name: minio
          image: bitnamilegacy/minio:latest
          ports:
            - { name: main, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: vms-secrets
                  key: VMS_STORAGE_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vms-secrets
                  key: VMS_STORAGE_SECRET_KEY
            - name: MINIO_DEFAULT_BUCKETS
              value: "vms-segments,vms-keyframes,vms-twins,vms-crops,vms-masks,vms-evidence,vms-reports,vms-models"
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /bitnami/minio/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: genai-vms
    vms.io/tier: infra
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - { name: main, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
