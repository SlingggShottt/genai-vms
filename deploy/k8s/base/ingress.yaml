apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vms
  labels:
    app.kubernetes.io/part-of: genai-vms
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
