[project]
name = "vms-annotation-kit"
version = "0.1.0"
description = "Caption and VQA annotation kit (P3-J6): Label Studio configs from the VQA bank, pre-annotation, and the converter to phavr_labels.jsonl"
requires-python = ">=3.11"
dependencies = [
    "vms-common",
    "pydantic>=2.9",
]

[project.scripts]
annotation-kit = "annotation_kit.cli:main"

[tool.uv.sources]
vms-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotation_kit"]
