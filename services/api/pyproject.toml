[project]
name = "vms-api"
version = "0.1.0"
description = "Auth/RBAC, CRUD, recordings playlists, alerts (Kafka to WebSocket), notifier plugins, BFF proxy to retrieval/reasoning, audit."
requires-python = ">=3.11"
dependencies = ["vms-common"]

[tool.uv.sources]
vms-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
