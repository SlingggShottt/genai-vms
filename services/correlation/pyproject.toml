[project]
name = "vms-correlation"
version = "0.1.0"
description = "Topology-aware time-aligned linking of verified events across cameras; group open/close."
requires-python = ">=3.11"
dependencies = ["vms-common"]

[tool.uv.sources]
vms-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/correlation"]
