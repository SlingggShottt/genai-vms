[project]
name = "vms-ingestion"
version = "0.1.0"
description = "One worker per camera: RTSP pull + segmenter (ffmpeg -c copy), 1 fps keyframes, reconnect/backoff, status heartbeat."
requires-python = ">=3.11"
dependencies = [
    "vms-common",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
ingestion = "ingestion.main:main"

[tool.uv.sources]
vms-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
