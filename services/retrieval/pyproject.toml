[project]
name = "vms-retrieval"
version = "0.1.0"
description = "Text search pipeline (decompose, coarse retrieval, LLM rerank), image search, JIT refinement, RAG assistant."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.4",
    "protobuf>=4.25",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.11",
    "sentencepiece>=0.2",
    # The same torch/transformers pair perception was verified with (CPU use here).
    "torch==2.6.0",
    "transformers>=4.49,<5.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
    "vms-common[llm]",
    "vms-db",
]

[project.scripts]
retrieval = "retrieval.main:main"

[tool.uv.sources]
vms-common = { workspace = true }
vms-db = { workspace = true }
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]
