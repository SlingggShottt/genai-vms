[project]
name = "vms-retrieval"
version = "0.1.0"
description = "Text search pipeline (decompose, coarse retrieval, LLM rerank), image search, JIT refinement, RAG assistant."
requires-python = ">=3.11"
dependencies = ["vms-common"]

[tool.uv.sources]
vms-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]
