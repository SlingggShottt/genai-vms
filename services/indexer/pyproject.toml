[project]
name = "vms-indexer"
version = "0.1.0"
description = "Idempotent writes of segments, tracks, event captions and incident sections into PostgreSQL + Qdrant."
requires-python = ">=3.11"
dependencies = ["vms-common[knowledge]", "vms-db", "qdrant-client>=1.11,<1.12"]

[project.scripts]
indexer = "indexer.main:main"

[tool.uv.sources]
vms-common = { workspace = true }
vms-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexer"]
