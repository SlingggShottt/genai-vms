[project]
name = "vms-events"
version = "0.1.0"
description = "Sliding per-camera state over twins; rule engine; candidate to VLM-verified event; persistence."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "vms-common[llm]",
    "vms-db",
]

[project.scripts]
events = "events.main:main"

[tool.uv.sources]
vms-common = { workspace = true }
vms-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/events"]
