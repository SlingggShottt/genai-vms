[project]
name = "vms-events"
version = "0.1.0"
description = "Sliding per-camera state over twins; rule engine; candidate to VLM-verified event; persistence."
requires-python = ">=3.11"
dependencies = ["vms-common"]

[tool.uv.sources]
vms-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/events"]
