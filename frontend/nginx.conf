server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The api, and its WebSocket (/api/v1/ws).
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;   # the assistant and search stream for minutes on a small GPU
    proxy_buffering off;       # server-sent events must not be held back
  }

  # Single-page app: any other path is the app's own route.
  location / {
    try_files $uri /index.html;
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
